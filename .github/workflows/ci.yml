name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The apps import the built output of the shared and db packages, so these come first.
      - run: pnpm build:packages
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @ricochet/api test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway services for the API to talk to. The tests create their own database inside this Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ricochet
          POSTGRES_PASSWORD: ricochet
          POSTGRES_DB: ricochet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricochet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ricochet:ricochet@localhost:5432/ricochet
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # Builds the API, then runs it. The tests import the compiled output.
      - run: pnpm --filter @ricochet/api test:e2e
      - run: pnpm --filter @ricochet/api typecheck:e2e

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
